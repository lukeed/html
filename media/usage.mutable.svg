<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="644" viewBox="0 0 1330 644">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <style>
    text { font-family: Hack, "DejaVu Sans Mono", Menlo, monospace; font-size: 22px; fill: #abb2bf; white-space: pre; }
    .c { fill: #5c6370; font-style: italic; }
    .k { fill: #c678dd; }
    .s { fill: #98c379; }
    .v { fill: #e5c07b; }
    .r { fill: #e06c75; }
    .m { fill: #56b6c2; }
  </style>
  <rect width="1330" height="644" fill="#4a90e2"/>
  <rect x="110" y="110" width="1110" height="424" rx="10" fill="#282c34" filter="url(#shadow)"/>
  <circle cx="154" cy="154" r="12" fill="#ff5f56"/>
  <circle cx="194" cy="154" r="12" fill="#ffbd2e"/>
  <circle cx="234" cy="154" r="12" fill="#27c93f"/>
  <g transform="translate(158 234)" xml:space="preserve">
    <text y="0"><tspan class="c">// example.ts</tspan></text>
    <text y="72"><tspan class="k">import</tspan> { <tspan class="v">parse</tspan>, <tspan class="v">stringify</tspan> } <tspan class="k">from</tspan> <tspan class="s">"@lukeed/html/mutable"</tspan>;</text>
    <text y="144"><tspan class="k">let</tspan> <tspan class="v">doc</tspan> <tspan class="m">=</tspan> <tspan class="r">parse</tspan>(<tspan class="s">"&lt;ul&gt;&lt;li&gt;a&lt;/li&gt;&lt;/ul&gt;"</tspan>);</text>
    <text y="180"><tspan class="r">doc</tspan>.<tspan class="m">find</tspan>(<tspan class="s">"li"</tspan>)?.<tspan class="m">setAttr</tspan>(<tspan class="s">"class"</tspan>, <tspan class="s">"first"</tspan>);</text>
    <text y="216"><tspan class="r">doc</tspan>.<tspan class="m">find</tspan>(<tspan class="s">"ul"</tspan>)?.<tspan class="m">append</tspan>(<tspan class="m">...</tspan><tspan class="r">parse</tspan>(<tspan class="s">"&lt;li&gt;b&lt;/li&gt;"</tspan>).<tspan class="r">children</tspan>);</text>
    <text y="252"><tspan class="r">stringify</tspan>(<tspan class="r">doc</tspan>); <tspan class="c">//=&gt; '&lt;ul&gt;&lt;li class="first"&gt;a&lt;/li&gt;&lt;li&gt;b&lt;/li&gt;&lt;/ul&gt;'</tspan></text>
  </g>
</svg>
